name: Custom ExtensionKit SideStore Build

on:
  push:
    branches:
      - agent/extensionkit-support
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify ExtensionKit dependency chain
        run: |
          test "$(git -C Dependencies/AltSign rev-parse HEAD)" = "d070b07689624f53bfff408365999483bbd7dab4"
          test "$(git -C Dependencies/AltSign/Dependencies/ldid rev-parse HEAD)" = "040463e328a4daf4756e49bf4682092a065c0f34"
          grep -q 'github.com/davidpovarsky/ldid.git' Dependencies/AltSign/.gitmodules
          grep -q 'appendingPathComponent("Extensions", isDirectory: true)' Dependencies/AltSign/Sources/Model/ALTApplication.swift
          grep -q 'appendingPathComponent("Extensions", isDirectory: true)' SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
          grep -q 'extensionDirectories.append(extensionKitURL)' SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
          grep -q 'com.apple.developer.translation-app' Dependencies/AltSign/Sources/ALTCapabilities.swift
          grep -q 'enableDynamicCapability' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q 'capabilitiesDiagnosticJSON' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q 'developer-portal-full' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q 'translationAdvertisedByAnyProbe' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q 'profileKey' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q '^import SwiftBridge$' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift

      - name: Patch ldid for ExtensionKit nested code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dependencies/AltSign/Dependencies/ldid/ldid.cpp")
          text = path.read_text()

          replacements = [
              (
                  "Frameworks|SharedFrameworks|PlugIns|Plug-ins|XPCServices",
                  "Frameworks|SharedFrameworks|PlugIns|Plug-ins|Extensions|XPCServices",
              ),
              (
                  r"Frameworks/[^/]*\\.framework|PlugIns/[^/]*\\.appex",
                  r"Frameworks/[^/]*\\.framework|(PlugIns|Extensions)/[^/]*\\.appex",
              ),
              (
                  'Starts(name, "PlugIns/") ? alter :',
                  '(Starts(name, "PlugIns/") || Starts(name, "Extensions/")) ? alter :',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one ldid match for {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

          grep -Fq '(PlugIns|Extensions)/[^/]*\\.appex' Dependencies/AltSign/Dependencies/ldid/ldid.cpp
          grep -Fq 'Starts(name, "Extensions/")' Dependencies/AltSign/Dependencies/ldid/ldid.cpp

      - name: Patch SideStore for dynamic Translation capability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift")
          text = path.read_text()
          old = '        self.debugLog("[FetchProvisioningProfilesInstall] Fetching profile from Apple for App ID \\(groupAppID.bundleIdentifier)...")\n        return try await super.fetchProvisioningProfile(for: groupAppID, targetAppBundle: targetAppBundle, team: team, session: session)\n'
          new = '        if targetAppBundle.entitlements[ALTEntitlementTranslationApp] as? Bool == true {\n            self.debugLog("[FetchProvisioningProfilesInstall] Translation entitlement requested. Discovering matching Developer Portal capability...")\n            do {\n                let capabilityID = try await ALTAppleAPI.shared.enableDynamicCapability(\n                    for: ALTEntitlementTranslationApp,\n                    bundleIdentifier: groupAppID.bundleIdentifier,\n                    team: team,\n                    session: session\n                )\n                self.debugLog("[FetchProvisioningProfilesInstall] Enabled Translation capability \\(capabilityID) for \\(groupAppID.bundleIdentifier).")\n            } catch {\n                self.debugLog("[FetchProvisioningProfilesInstall] Failed to enable Translation capability: \\(error.localizedDescription)")\n                throw OperationError.invalidParameters("Could not enable the Default Translation App capability for \\(groupAppID.bundleIdentifier): \\(error.localizedDescription)")\n            }\n        }\n\n        self.debugLog("[FetchProvisioningProfilesInstall] Fetching profile from Apple for App ID \\(groupAppID.bundleIdentifier)...")\n        let profile = try await super.fetchProvisioningProfile(for: groupAppID, targetAppBundle: targetAppBundle, team: team, session: session)\n\n        if targetAppBundle.entitlements[ALTEntitlementTranslationApp] as? Bool == true {\n            let granted = profile.entitlements[ALTEntitlementTranslationApp] as? Bool == true\n            self.debugLog("[FetchProvisioningProfilesInstall] Translation entitlement requested; provisioning profile granted=\\(granted)")\n            guard granted else {\n                throw OperationError.invalidParameters("Apple did not grant com.apple.developer.translation-app in the provisioning profile for \\(groupAppID.bundleIdentifier) after the matching Developer Portal capability was enabled.")\n            }\n        }\n\n        return profile\n'

          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"Expected exactly one provisioning-profile return block, found {count}")
          path.write_text(text.replace(old, new))
          PY

          grep -q 'enableDynamicCapability' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift
          grep -q 'Translation entitlement requested; provisioning profile granted=' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift
          grep -q 'after the matching Developer Portal capability was enabled' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift

      - name: Patch SideStore Apple capability diagnostic UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SideStore/Views/Settings/Diagnostics/DeveloperOptionsView.swift")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one {label} anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "import WidgetKit\n",
              "import WidgetKit\nimport UIKit\n",
              "UIKit import",
          )

          state_anchor = '    @State private var exportCertPassword: String = ""\n'
          state_addition = "\n".join([
              state_anchor.rstrip("\n"),
              '    @State private var isRunningAppleCapabilitiesDiagnostic: Bool = false',
              '    @State private var showAppleCapabilitiesDiagnosticResult: Bool = false',
              '    @State private var appleCapabilitiesDiagnosticMessage: String = ""',
              '',
          ])
          replace_once(state_anchor, state_addition, "diagnostic state")

          section_anchor = '                // Section: Widget Options\n'
          section = "\n".join([
              '                // Section: Apple Capability Diagnostics',
              '                VStack(alignment: .leading, spacing: 8) {',
              '                    Text("APPLE CAPABILITY DIAGNOSTICS")',
              '                        .font(.system(size: 13, weight: .semibold))',
              '                        .foregroundColor(Color.white.opacity(0.6))',
              '                        .padding(.horizontal, 16)',
              '',
              '                    VStack(spacing: 0) {',
              '                        SwiftUI.Button(action: {',
              '                            Task { await runAppleCapabilitiesDiagnostic() }',
              '                        }) {',
              '                            HStack(spacing: 12) {',
              '                                Image(systemName: "network")',
              '                                    .font(.system(size: 18, weight: .semibold))',
              '                                    .foregroundColor(.white)',
              '                                Text("Apple Capabilities Diagnostic")',
              '                                    .font(.system(size: 17, weight: .bold))',
              '                                    .foregroundColor(.white)',
              '                                Spacer()',
              '                                if isRunningAppleCapabilitiesDiagnostic {',
              '                                    ProgressView()',
              '                                        .progressViewStyle(CircularProgressViewStyle(tint: .white))',
              '                                }',
              '                            }',
              '                            .padding(.horizontal, 16)',
              '                            .frame(height: 50)',
              '                        }',
              '                        .disabled(isRunningAppleCapabilitiesDiagnostic)',
              '                    }',
              '                    .background(Color.settingsRowBackground)',
              '                    .cornerRadius(14)',
              '',
              '                    Text("Read-only. Queries Apple with the current Xcode session, copies a redacted JSON report, and does not create or modify App IDs, capabilities, or provisioning profiles.")',
              '                        .font(.system(size: 12))',
              '                        .foregroundColor(Color.white.opacity(0.5))',
              '                        .padding(.horizontal, 16)',
              '                }',
              '',
          ])
          replace_once(section_anchor, section + section_anchor, "diagnostic section")

          alert_anchor = '        .alert("Clear Keychain Items", isPresented: $showClearKeychainConfirmation) {\n'
          diagnostic_alert = "\n".join([
              '        .alert("Apple Capabilities Diagnostic", isPresented: $showAppleCapabilitiesDiagnosticResult) {',
              '            SwiftUI.Button("OK", role: .cancel) {}',
              '        } message: {',
              '            Text(appleCapabilitiesDiagnosticMessage)',
              '        }',
              '',
          ])
          replace_once(alert_anchor, diagnostic_alert + alert_anchor, "diagnostic alert")

          helper_anchor = '    private var divider: some View {\n'
          helper = "\n".join([
              '    @MainActor',
              '    private func runAppleCapabilitiesDiagnostic() async {',
              '        guard !isRunningAppleCapabilitiesDiagnostic else { return }',
              '        isRunningAppleCapabilitiesDiagnostic = true',
              '        defer { isRunningAppleCapabilitiesDiagnostic = false }',
              '',
              '        let authManager = AuthManager.shared',
              '        if authManager.team == nil || authManager.session == nil {',
              '            do {',
              '                _ = try await authManager.authenticate(',
              '                    presentingViewController: topViewController(),',
              '                    skipDeviceRegistration: true,',
              '                    skipCertificateProvisioning: true',
              '                )',
              '            } catch {',
              '                appleCapabilitiesDiagnosticMessage = "Could not establish a read-only Apple/Xcode session: \\(error.localizedDescription)"',
              '                showAppleCapabilitiesDiagnosticResult = true',
              '                return',
              '            }',
              '        }',
              '',
              '        guard let team = authManager.team, let session = authManager.session else {',
              '            appleCapabilitiesDiagnosticMessage = "No active Apple Developer session is available after authentication. Refresh/sign in to SideStore, then run the diagnostic again."',
              '            showAppleCapabilitiesDiagnosticResult = true',
              '            return',
              '        }',
              '',
              '        let json = await ALTAppleAPI.shared.capabilitiesDiagnosticJSON(team: team, session: session)',
              '        UIPasteboard.general.string = json',
              '        debugLog("[AppleCapabilitiesDiagnostic] Redacted report copied to clipboard for team \\(team.identifier).")',
              '        appleCapabilitiesDiagnosticMessage = "The read-only redacted capability report for team \\(team.identifier) was copied to the clipboard. Paste the JSON into ChatGPT for analysis."',
              '        showAppleCapabilitiesDiagnosticResult = true',
              '    }',
              '',
          ])
          replace_once(helper_anchor, helper + helper_anchor, "diagnostic helper")

          path.write_text(text)
          PY

          grep -q 'Apple Capabilities Diagnostic' SideStore/Views/Settings/Diagnostics/DeveloperOptionsView.swift
          grep -q 'capabilitiesDiagnosticJSON' SideStore/Views/Settings/Diagnostics/DeveloperOptionsView.swift
          grep -q 'skipCertificateProvisioning: true' SideStore/Views/Settings/Diagnostics/DeveloperOptionsView.swift
          grep -q 'UIPasteboard.general.string = json' SideStore/Views/Settings/Diagnostics/DeveloperOptionsView.swift

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build SideStore IPA
        run: python3 scripts/ci/workflow.py build

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-ExtensionKit
          path: SideStore.ipa
          if-no-files-found: error
