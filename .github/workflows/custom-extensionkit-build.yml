name: Custom ExtensionKit SideStore Build

on:
  push:
    branches:
      - agent/extensionkit-support
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify ExtensionKit dependency chain
        run: |
          test "$(git -C Dependencies/AltSign rev-parse HEAD)" = "562a0b288bc9f7e07ee7e74dc478cd74f5d61d3b"
          test "$(git -C Dependencies/AltSign/Dependencies/ldid rev-parse HEAD)" = "040463e328a4daf4756e49bf4682092a065c0f34"
          grep -q 'github.com/davidpovarsky/ldid.git' Dependencies/AltSign/.gitmodules
          grep -q 'appendingPathComponent("Extensions", isDirectory: true)' Dependencies/AltSign/Sources/Model/ALTApplication.swift
          grep -q 'appendingPathComponent("Extensions", isDirectory: true)' SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
          grep -q 'extensionDirectories.append(extensionKitURL)' SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
          grep -q 'com.apple.developer.translation-app' Dependencies/AltSign/Sources/ALTCapabilities.swift
          grep -q 'enableDynamicCapability' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q 'profileKey' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift
          grep -q '^import SwiftBridge$' Dependencies/AltSign/Sources/ALTAppleAPI+DynamicCapabilities.swift

      - name: Patch ldid for ExtensionKit nested code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dependencies/AltSign/Dependencies/ldid/ldid.cpp")
          text = path.read_text()

          replacements = [
              (
                  "Frameworks|SharedFrameworks|PlugIns|Plug-ins|XPCServices",
                  "Frameworks|SharedFrameworks|PlugIns|Plug-ins|Extensions|XPCServices",
              ),
              (
                  r"Frameworks/[^/]*\\.framework|PlugIns/[^/]*\\.appex",
                  r"Frameworks/[^/]*\\.framework|(PlugIns|Extensions)/[^/]*\\.appex",
              ),
              (
                  'Starts(name, "PlugIns/") ? alter :',
                  '(Starts(name, "PlugIns/") || Starts(name, "Extensions/")) ? alter :',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one ldid match for {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

          grep -Fq '(PlugIns|Extensions)/[^/]*\\.appex' Dependencies/AltSign/Dependencies/ldid/ldid.cpp
          grep -Fq 'Starts(name, "Extensions/")' Dependencies/AltSign/Dependencies/ldid/ldid.cpp

      - name: Patch SideStore for dynamic Translation capability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift")
          text = path.read_text()
          old = '        self.debugLog("[FetchProvisioningProfilesInstall] Fetching profile from Apple for App ID \\(groupAppID.bundleIdentifier)...")\n        return try await super.fetchProvisioningProfile(for: groupAppID, targetAppBundle: targetAppBundle, team: team, session: session)\n'
          new = '        if targetAppBundle.entitlements[ALTEntitlementTranslationApp] as? Bool == true {\n            self.debugLog("[FetchProvisioningProfilesInstall] Translation entitlement requested. Discovering matching Developer Portal capability...")\n            do {\n                let capabilityID = try await ALTAppleAPI.shared.enableDynamicCapability(\n                    for: ALTEntitlementTranslationApp,\n                    bundleIdentifier: groupAppID.bundleIdentifier,\n                    team: team,\n                    session: session\n                )\n                self.debugLog("[FetchProvisioningProfilesInstall] Enabled Translation capability \\(capabilityID) for \\(groupAppID.bundleIdentifier).")\n            } catch {\n                self.debugLog("[FetchProvisioningProfilesInstall] Failed to enable Translation capability: \\(error.localizedDescription)")\n                throw OperationError.invalidParameters("Could not enable the Default Translation App capability for \\(groupAppID.bundleIdentifier): \\(error.localizedDescription)")\n            }\n        }\n\n        self.debugLog("[FetchProvisioningProfilesInstall] Fetching profile from Apple for App ID \\(groupAppID.bundleIdentifier)...")\n        let profile = try await super.fetchProvisioningProfile(for: groupAppID, targetAppBundle: targetAppBundle, team: team, session: session)\n\n        if targetAppBundle.entitlements[ALTEntitlementTranslationApp] as? Bool == true {\n            let granted = profile.entitlements[ALTEntitlementTranslationApp] as? Bool == true\n            self.debugLog("[FetchProvisioningProfilesInstall] Translation entitlement requested; provisioning profile granted=\\(granted)")\n            guard granted else {\n                throw OperationError.invalidParameters("Apple did not grant com.apple.developer.translation-app in the provisioning profile for \\(groupAppID.bundleIdentifier) after the matching Developer Portal capability was enabled.")\n            }\n        }\n\n        return profile\n'

          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"Expected exactly one provisioning-profile return block, found {count}")
          path.write_text(text.replace(old, new))
          PY

          grep -q 'enableDynamicCapability' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift
          grep -q 'Translation entitlement requested; provisioning profile granted=' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift
          grep -q 'after the matching Developer Portal capability was enabled' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build SideStore IPA
        run: python3 scripts/ci/workflow.py build

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-ExtensionKit
          path: SideStore.ipa
          if-no-files-found: error
