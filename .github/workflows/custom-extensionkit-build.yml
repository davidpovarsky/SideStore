name: Custom ExtensionKit SideStore Build

on:
  push:
    branches:
      - agent/extensionkit-support
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify ExtensionKit dependency chain
        run: |
          test "$(git -C Dependencies/AltSign rev-parse HEAD)" = "708b349ab03b5c93f70e290f1c9c824927d8cd0e"
          test "$(git -C Dependencies/AltSign/Dependencies/ldid rev-parse HEAD)" = "040463e328a4daf4756e49bf4682092a065c0f34"
          grep -q 'github.com/davidpovarsky/ldid.git' Dependencies/AltSign/.gitmodules
          grep -q 'appendingPathComponent("Extensions", isDirectory: true)' Dependencies/AltSign/Sources/Model/ALTApplication.swift
          grep -q 'appendingPathComponent("Extensions", isDirectory: true)' SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
          grep -q 'extensionDirectories.append(extensionKitURL)' SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
          grep -q 'com.apple.developer.translation-app' Dependencies/AltSign/Sources/ALTCapabilities.swift
          grep -q 'ALTEntitlementTranslationApp' Dependencies/AltSign/Sources/ALTCapabilities.swift

      - name: Patch ldid for ExtensionKit nested code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dependencies/AltSign/Dependencies/ldid/ldid.cpp")
          text = path.read_text()

          replacements = [
              (
                  "Frameworks|SharedFrameworks|PlugIns|Plug-ins|XPCServices",
                  "Frameworks|SharedFrameworks|PlugIns|Plug-ins|Extensions|XPCServices",
              ),
              (
                  r"Frameworks/[^/]*\\.framework|PlugIns/[^/]*\\.appex",
                  r"Frameworks/[^/]*\\.framework|(PlugIns|Extensions)/[^/]*\\.appex",
              ),
              (
                  'Starts(name, "PlugIns/") ? alter :',
                  '(Starts(name, "PlugIns/") || Starts(name, "Extensions/")) ? alter :',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one ldid match for {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

          grep -Fq '(PlugIns|Extensions)/[^/]*\\.appex' Dependencies/AltSign/Dependencies/ldid/ldid.cpp
          grep -Fq 'Starts(name, "Extensions/")' Dependencies/AltSign/Dependencies/ldid/ldid.cpp

      - name: Patch SideStore to validate Translation provisioning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift")
          text = path.read_text()

          old = '''        self.debugLog("[FetchProvisioningProfilesInstall] Fetching profile from Apple for App ID \\(groupAppID.bundleIdentifier)...")
        return try await super.fetchProvisioningProfile(for: groupAppID, targetAppBundle: targetAppBundle, team: team, session: session)
'''
          new = '''        self.debugLog("[FetchProvisioningProfilesInstall] Fetching profile from Apple for App ID \\(groupAppID.bundleIdentifier)...")
        let profile = try await super.fetchProvisioningProfile(for: groupAppID, targetAppBundle: targetAppBundle, team: team, session: session)

        if targetAppBundle.entitlements[ALTEntitlementTranslationApp] as? Bool == true {
            let granted = profile.entitlements[ALTEntitlementTranslationApp] as? Bool == true
            self.debugLog("[FetchProvisioningProfilesInstall] Translation entitlement requested; provisioning profile granted=\\(granted)")
            guard granted else {
                throw OperationError.invalidParameters("Apple did not grant com.apple.developer.translation-app in the provisioning profile for \\(groupAppID.bundleIdentifier). This Apple ID/team cannot currently provision the Default Translation App capability through SideStore.")
            }
        }

        return profile
'''

          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"Expected exactly one provisioning-profile return block, found {count}")

          path.write_text(text.replace(old, new))
          PY

          grep -q 'Translation entitlement requested; provisioning profile granted=' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift
          grep -q 'Apple did not grant com.apple.developer.translation-app' SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build SideStore IPA
        run: python3 scripts/ci/workflow.py build

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-ExtensionKit
          path: SideStore.ipa
          if-no-files-found: error
